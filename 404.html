<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página no encontrada — Lana Rosa Crochet</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/img/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@600&family=Hanken+Grotesk:wght@400;600&display=swap" rel="stylesheet">
<style>
:root { --rosa-principal: #E74E96; --rosa-suave: #FBE4EF; --blanco-hueso: #FAFAF7; --tinta: #45454A; --tinta-suave: #6E6E73; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: 'Hanken Grotesk', -apple-system, BlinkMacSystemFont, sans-serif; color: var(--tinta); background: var(--blanco-hueso); line-height: 1.6; text-align: center; }
main { max-width: 520px; }
img { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; }
h1 { font-family: 'DynaPuff', sans-serif; font-weight: 600; font-size: 2rem; margin: 16px 0 8px; }
p { color: var(--tinta-suave); margin: 0 0 24px; }
.acciones { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
a { display: inline-block; padding: 12px 22px; border-radius: 999px; font-weight: 600; text-decoration: none; }
.primario { background: var(--rosa-principal); color: #fff; }
.secundario { background: var(--rosa-suave); color: var(--rosa-principal); }
</style>
</head>
<body>
<main>
  <img src="/img/icono-rosina-circular.png" alt="Rosina, la ovejita de Lana Rosa Crochet">
  <h1>Esta página se nos destejió</h1>
  <p>La dirección que buscas no existe o cambió de lugar. Desde el inicio puedes encontrar todo lo que tejemos.</p>
  <div class="acciones">
    <a class="primario" href="/">Ir al inicio</a>
    <a class="secundario" href="/tienda.html">Ver la tienda</a>
  </div>
</main>
</body>
</html>
