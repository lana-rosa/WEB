name: Prueba de restauración de la copia de seguridad

# Toma la última copia correcta (flujo «Copia de seguridad de la base de datos»), la descifra con COPIA_CLAVE, la restaura en una base de datos
# temporal de PostgreSQL 17 que vive solo dentro de este flujo y cuenta lo que quedó. Imprime SOLO números y nombres de tipos de error, nunca datos
# (los registros de este repositorio son públicos). Se corre a mano y el día 1 de cada mes.
# Guía: herramientas/copias/LEEME.md

on:
  schedule:
    - cron: '41 9 1 * *'   # 4:41 a. m. hora de Colombia, día 1 de cada mes
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  restaurar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      pg:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: prueba
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      GH_TOKEN: ${{ github.token }}
      CLAVE: ${{ secrets.COPIA_CLAVE }}
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: prueba
    steps:
      - name: Instalar el cliente de PostgreSQL 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Bajar y descifrar la última copia
        run: |
          set -euo pipefail
          umask 077
          RUN=$(gh run list -R "$GITHUB_REPOSITORY" --workflow copia-base-datos.yml --status success --limit 1 --json databaseId -q '.[0].databaseId')
          if [ -z "$RUN" ]; then echo "::error::No hay ninguna copia correcta para probar"; exit 1; fi
          echo "Copia tomada de la ejecución $RUN"
          gh run download "$RUN" -R "$GITHUB_REPOSITORY" -D bajada
          ARCH=$(find bajada -name '*.gpg' | head -1)
          if [ -z "$ARCH" ]; then echo "::error::No se encontró el archivo .gpg descargado"; ls -R bajada; exit 1; fi
          echo "Archivo: $(basename "$ARCH") · $(stat -c %s "$ARCH") bytes"
          CLAVE=$(printf '%s' "$CLAVE" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          printf '%s' "$CLAVE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --decrypt -o copia.dump "$ARCH"
          /usr/lib/postgresql/17/bin/pg_restore --list copia.dump > lista.txt
          echo "Tablas con datos en la copia: $(grep -c ' TABLE DATA ' lista.txt)"

      - name: Restaurar en una base temporal
        run: |
          set -uo pipefail
          psql -v ON_ERROR_STOP=0 -q -c "create database prueba" -d postgres
          export PGDATABASE=prueba
          # Lo mínimo que Supabase trae y la copia da por hecho (roles y esquema de extensiones)
          for r in anon authenticated service_role authenticator supabase_auth_admin supabase_storage_admin supabase_admin dashboard_user pgbouncer; do
            psql -q -d prueba -c "do \$\$ begin if not exists (select 1 from pg_roles where rolname='$r') then create role $r nologin; end if; end \$\$;" || true
          done
          psql -q -d prueba -c "create schema if not exists extensions;" || true
          for e in pgcrypto "uuid-ossp" pg_trgm unaccent citext; do psql -q -d prueba -c "create extension if not exists \"$e\" with schema extensions;" || true; done
          /usr/lib/postgresql/17/bin/pg_restore --no-owner --no-privileges -d prueba copia.dump 2> errores.txt || true
          echo "Líneas de error al restaurar: $(grep -c '^pg_restore: error' errores.txt || true)"
          echo "Tipos de error (solo el comienzo del mensaje, sin datos):"
          grep -o 'ERROR:  [a-zA-Z ]\{1,40\}' errores.txt | sort | uniq -c | sort -rn | head -12 || true

      - name: Comprobar lo restaurado (solo conteos)
        run: |
          set -uo pipefail
          export PGDATABASE=prueba
          TP=$(psql -tA -c "select count(*) from information_schema.tables where table_schema='public' and table_type='BASE TABLE'")
          TA=$(psql -tA -c "select count(*) from information_schema.tables where table_schema='auth' and table_type='BASE TABLE'")
          echo "Tablas restauradas: public=$TP auth=$TA"
          FALLA=0
          for t in inventario_items terceros ventas_pos pedidos_web cuentas_clientes_web; do
            if [ "$(psql -tA -c "select to_regclass('public.$t') is not null")" = "t" ]; then
              echo "$t: $(psql -tA -c "select count(*) from public.$t") filas"
            else
              echo "$t: NO EXISTE"; FALLA=1
            fi
          done
          if [ "$TP" -lt 100 ]; then echo "::error::Se restauraron muy pocas tablas de public ($TP)"; FALLA=1; fi
          if [ "$(psql -tA -c "select count(*) from public.inventario_items")" -lt 1 ]; then echo "::error::inventario_items quedó vacía"; FALLA=1; fi
          if [ "$FALLA" -ne 0 ]; then exit 1; fi
          echo "✅ La copia se puede abrir y restaurar."
