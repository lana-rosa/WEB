<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pruebas en iPhone y Samsung</title><style>body{margin:0;font:16px/1.5 system-ui,sans-serif;background:#f5fbf8;color:#23332b}main{max-width:720px;margin:0 auto;padding:20px 16px 60px}h1,h2{color:#0c8556}ul{list-style:none;padding:0}li{background:#fff;border:1px solid #d8eee2;border-radius:10px;margin:8px 0;padding:10px 12px}input{width:20px;height:20px;vertical-align:-4px;margin-right:6px}li:has(input:checked){opacity:.55}</style></head><body><main><h1>Pruebas en iPhone y Samsung</h1><p>Marca cada punto y, si algo falla, tómale una captura y mándamela con el número del punto.</p><h2>iPhone (Safari)</h2><ul><li><label><input type="checkbox" data-k="1"> Abre lanarosacrochet.com/agenda-rosina.html, entra con tu correo y escribe tu nombre en la Portada.</label></li><li><label><input type="checkbox" data-k="2"> Escribe algo en 3 hojas distintas (por ejemplo Planeador, Control de pedidos, Mis ideas). Cierra Safari por completo y vuelve a abrir: ¿sigue todo ahí?</label></li><li><label><input type="checkbox" data-k="3"> Toca 🎤 Dictar en Mis ideas: ¿pide permiso del micrófono y escribe lo que dices?</label></li><li><label><input type="checkbox" data-k="4"> Compartir → Añadir a pantalla de inicio. Abre la app desde el ícono: ¿se ve redonda con la ovejita y abre la agenda?</label></li><li><label><input type="checkbox" data-k="5"> Pon el teléfono en modo avión y abre la app: ¿abre sin internet?</label></li><li><label><input type="checkbox" data-k="6"> En ⚙️ Configuración → ⬇️ Guardar una copia: ¿se descarga el archivo? ¿Puedes cargarlo con ⬆️ Cargar una copia?</label></li><li><label><input type="checkbox" data-k="7"> En ⚙️ Configuración → 📊 Exportar a Excel: ¿se descarga y abre en Numbers o Excel? ¿Los valores en pesos se pueden sumar?</label></li><li><label><input type="checkbox" data-k="8"> Hoja de dibujo: dibuja con el dedo (activa «Dedo») y, si tienes, con Apple Pencil en iPad.</label></li></ul><h2>Samsung (Chrome o Samsung Internet)</h2><ul><li><label><input type="checkbox" data-k="9"> Entra a la agenda con tu correo y escribe en 3 hojas. Cierra el navegador y vuelve a abrir: ¿sigue todo?</label></li><li><label><input type="checkbox" data-k="10"> Toca 🎤 Dictar en Mis ideas: ¿escribe lo que dices?</label></li><li><label><input type="checkbox" data-k="11"> Instalar la app (tarjeta «Instala tu agenda como app»): ¿el ícono es redondo con la ovejita?</label></li><li><label><input type="checkbox" data-k="12"> Hoja de dibujo con el dedo y con el S Pen (si tienes).</label></li><li><label><input type="checkbox" data-k="13"> Modo avión: ¿abre la app sin internet?</label></li><li><label><input type="checkbox" data-k="14"> Guardar una copia, cargarla y exportar a Excel.</label></li></ul><h2>En ambos</h2><ul><li><label><input type="checkbox" data-k="15"> Entra con una segunda cuenta de correo en el mismo teléfono: ¿aparece el aviso «Esta agenda ya tiene hojas escritas»?</label></li><li><label><input type="checkbox" data-k="16"> Anota en la hoja de Pedidos un pedido «Entregado» y toca «Pasarlos a Mis ventas».</label></li><li><label><input type="checkbox" data-k="17"> Anota cualquier cosa que se vea rara, cortada o difícil y mándame una captura.</label></li></ul></main><script>try{var s=JSON.parse(localStorage.getItem('pr-ag')||'{}');document.querySelectorAll('input').forEach(function(i){i.checked=!!s[i.dataset.k]});document.addEventListener('change',function(){var o={};document.querySelectorAll('input:checked').forEach(function(i){o[i.dataset.k]=1});localStorage.setItem('pr-ag',JSON.stringify(o))})}catch(e){}</script></body></html>
