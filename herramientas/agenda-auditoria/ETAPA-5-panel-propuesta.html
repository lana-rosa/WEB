<!doctype html>
<html lang="es-CO"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agenda para tejedoras · Panel (propuesta)</title>
<link rel="stylesheet" href="/css/fuentes.css">
<style>
:root{--vino:#743D50;--vo:#5C2F3F;--rosa:#E8D5D4;--rs:#F6EEED;--tinta:#2B1B21;--t2:#6B5560;--linea:#E8DAD9;--ok:#1F7A4D}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 "Hanken Grotesk",sans-serif;color:var(--tinta);background:#F3E9E8}
h1,h2,h3{margin:0;font-family:"Hanken Grotesk";color:var(--vo)}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.lado{background:#fff;border-right:1px solid var(--linea);padding:18px 14px;display:flex;flex-direction:column;gap:4px}
.marca{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;font-family:DynaPuff;color:var(--vo);font-size:1.05rem}
.marca i{width:38px;height:38px;border-radius:10px;background:var(--vino);display:grid;place-items:center;color:var(--rosa);font-style:normal}
.lado a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:var(--t2);text-decoration:none;font-weight:600;min-height:44px}
.lado a.on{background:var(--rosa);color:var(--vo)}
.lado a.lock{opacity:.9}.lado a .cand{margin-left:auto;width:16px;height:16px}
.lado .pie{margin-top:auto;font-size:.8rem;color:var(--t2);padding:10px 12px;border-top:1px solid var(--linea)}
main{padding:22px 28px 40px;min-width:0}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.top .buscar{flex:1;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--linea);border-radius:999px;padding:0 16px;min-height:44px;color:var(--t2)}
.circ{width:44px;height:44px;border-radius:50%;background:#fff;border:1px solid var(--linea);display:grid;place-items:center;color:var(--vino)}
.saludo h1{font-size:1.7rem}.saludo p{margin:2px 0 18px;color:var(--t2)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.card{background:#fff;border:1px solid var(--linea);border-radius:16px;padding:16px;box-shadow:0 4px 18px rgba(92,47,63,.05)}
.kpi small{color:var(--t2);font-weight:600;display:flex;align-items:center;gap:6px}.kpi b{display:block;font-size:1.65rem;color:var(--vo);margin:4px 0 2px}
.kpi span{font-size:.8rem;color:var(--ok);font-weight:600}.kpi span.n{color:var(--t2)}
.dos{display:grid;grid-template-columns:1.1fr 1fr;gap:14px;margin-bottom:14px}
.card h3{font-size:1.05rem;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}.card h3 a{font-size:.8rem;font-weight:600;color:var(--vino)}
.fila{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--linea)}.fila:first-of-type{border-top:0}
.fecha{width:46px;text-align:center;background:var(--rs);border-radius:10px;padding:4px 0;font-size:.7rem;color:var(--t2);font-weight:700;text-transform:uppercase}.fecha b{display:block;font-size:1.1rem;color:var(--vo)}
.fila div.t{flex:1;min-width:0}.fila div.t b{display:block}.fila div.t small{color:var(--t2)}
.chip{font-size:.72rem;padding:3px 10px;border-radius:999px;font-weight:700;background:var(--rosa);color:var(--vo);white-space:nowrap}.chip.ok{background:#DDF1E6;color:var(--ok)}.chip.av{background:#FBEBC8;color:#8A5A00}
.barra{height:8px;border-radius:99px;background:var(--rs);overflow:hidden;margin-top:6px}.barra i{display:block;height:100%;background:var(--vino);border-radius:99px}
.acc{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.acc a{display:flex;align-items:center;gap:8px;justify-content:center;min-height:48px;border-radius:12px;background:var(--rs);color:var(--vo);font-weight:700;text-decoration:none;padding:0 8px;font-size:.9rem}
.frase{margin-top:14px;background:linear-gradient(120deg,var(--rs),#fff);font-style:italic;color:var(--vo)}
.cab-sec{display:flex;align-items:center;gap:12px;margin-bottom:6px}.cab-sec .ic{width:30px;height:30px;color:var(--vino)}
.hojas{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}
.hj{display:flex;gap:12px;align-items:flex-start}.hj .ic{color:var(--vino);width:26px;height:26px;margin-top:2px}.hj b{display:block;color:var(--vo)}.hj small{color:var(--t2)}
.hj.bloq{background:var(--rs)}.hj.bloq .ic{color:var(--t2)}
.migas{font-size:.85rem;color:var(--t2);margin-bottom:10px}
/* celular */
.mov{display:none}
@media(max-width:820px){
 .app{display:block}.lado{display:none}
 main{padding:12px 14px 90px}
 .kpis{grid-template-columns:1fr 1fr}.dos{grid-template-columns:1fr}.acc{grid-template-columns:1fr 1fr}.hojas{grid-template-columns:1fr}
 .saludo h1{font-size:1.4rem}.kpi b{font-size:1.35rem}
 .mov{display:flex;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--linea);padding:6px 4px;justify-content:space-around;z-index:5}
 .mov a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.68rem;color:var(--t2);text-decoration:none;font-weight:600;min-width:52px;min-height:48px;justify-content:center;border-radius:10px}
 .mov a.on{color:var(--vo);background:var(--rosa)}
}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>

<symbol id="proy" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M5 9c4 1 9 1 14 0M4.5 14c5 1.5 10 1.5 15 0M9 4.5c-1 5 0 10 3 15"/></symbol>

<symbol id="fec" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
<symbol id="mas" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="cand" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></symbol>
<symbol id="bus" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>
<symbol id="cfg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></symbol>
<symbol id="usr" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></symbol>
<symbol id="hoja" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6zM15 3v4h4M9 12h7M9 16h7"/></symbol>
<symbol id="caja" viewBox="0 0 24 24"><path d="M3 7l9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10"/></symbol>
</defs></svg>
<div class="app">
<aside class="lado">
 <div class="marca"><i>🐑</i>Agenda para<br>tejedoras</div>
 <a class="" href="#"><svg class="ic"><use href="#inicio"/></svg>Mi panel</a>
 <a class="" href="#"><svg class="ic"><use href="#proy"/></svg>Mis proyectos</a>
 <a class="" href="#"><svg class="ic"><use href="#mat"/></svg>Mis materiales</a>
 <a class="" href="#"><svg class="ic"><use href="#neg"/></svg>Mi emprendimiento</a>
 <a class="" href="#"><svg class="ic"><use href="#fin"/></svg>Finanzas del negocio</a>
 <a class="" href="#"><svg class="ic"><use href="#fec"/></svg>Fechas y bienestar</a>
 <div class="pie">7 días gratis · quedan 5<br><b style="color:var(--vino)">Ver planes</b></div>
</aside>
<main>
 <div class="top"><div class="buscar"><svg class="ic"><use href="#bus"/></svg>Buscar en mi agenda…</div><div class="circ"><svg class="ic"><use href="#cfg"/></svg></div><div class="circ"><svg class="ic"><use href="#usr"/></svg></div></div>
 
</main></div>
<nav class="mov">
 <a class=""><svg class="ic"><use href="#inicio"/></svg>Panel</a><a><svg class="ic"><use href="#proy"/></svg>Proyectos</a><a><svg class="ic"><use href="#mat"/></svg>Materiales</a><a><svg class="ic"><use href="#neg"/></svg>Negocio</a><a><svg class="ic"><use href="#fin"/></svg>Finanzas</a><a><svg class="ic"><use href="#fec"/></svg>Fechas</a>
</nav>
</body></html>
